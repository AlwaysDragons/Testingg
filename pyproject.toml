[project]
name = "dropship-mp"
version = "0.1.0"
description = "Marketplace-native dropship automation across Depop, Grailed, Mercari."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "playwright==1.47.0",
    "playwright-stealth==1.0.6",
    "redis==5.0.8",
    "rq==1.16.2",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.2",
    "httpx==0.27.2",
    "selectolax==0.3.21",
    "apscheduler==3.10.4",
    "python-dotenv==1.0.1",
    "Pillow==10.4.0",
    "python-telegram-bot==21.5",
    "rapidfuzz==3.9.7",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "loguru==0.7.2",
    "pytesseract==0.3.13",
    "reportlab==4.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.8",
    "mypy==1.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
