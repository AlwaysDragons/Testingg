# Phone-only project: the app without widgets, Live Activities or the Watch app.
# Use this with a free Apple ID (App Groups and extra App IDs need a paid account):
#   xcodegen --spec project-phone.yml && open Forge.xcodeproj
# Generated from project.yml's Forge target; keep the two in step.
name: Forge
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Forge:
    type: application
    platform: iOS
    sources:
      - Forge
    settings:
      base:
        # Change this to something unique (e.g. com.raoul.forge) before signing.
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.forge
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Support/Xcode-Info.plist
      properties:
        CFBundleDisplayName: Forge
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: Forge reads your sleep, HRV, resting heart rate, activity, body composition and nutrition to calculate readiness and optimize your training and recovery.
        NSHealthUpdateUsageDescription: Forge does not write to Apple Health.
        BGTaskSchedulerPermittedIdentifiers: [com.forge.briefing]
        UIBackgroundModes: [fetch]
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription: Forge uses Face ID to open areas you've locked.
        NSSpeechRecognitionUsageDescription: Forge turns what you say into a quick capture.
        NSMicrophoneUsageDescription: Forge listens only while you dictate a capture.
        CFBundleURLTypes:
          - CFBundleURLName: forge
            CFBundleURLSchemes: [forge]
        NSCalendarsFullAccessUsageDescription: Forge shows your events in Today and, only when you approve, adds planned time blocks.
        NSRemindersFullAccessUsageDescription: Forge syncs the Reminders lists you choose with your dashboard, both ways.
    entitlements:
      path: Support/Xcode.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
