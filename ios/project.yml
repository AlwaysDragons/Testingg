name: Forge
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Forge:
    type: application
    platform: iOS
    sources:
      - Forge
    settings:
      base:
        # Change this to something unique (e.g. com.raoul.forge) before signing.
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.forge
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Support/Xcode-Info.plist
      properties:
        CFBundleDisplayName: Forge
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: Forge reads your sleep, HRV, resting heart rate, activity, body composition and nutrition to calculate readiness and optimize your training and recovery.
        NSHealthUpdateUsageDescription: Forge does not write to Apple Health.
        BGTaskSchedulerPermittedIdentifiers: [com.forge.briefing]
        UIBackgroundModes: [fetch]
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription: Forge uses Face ID to open areas you've locked.
        NSSpeechRecognitionUsageDescription: Forge turns what you say into a quick capture.
        NSMicrophoneUsageDescription: Forge listens only while you dictate a capture.
        CFBundleURLTypes:
          - CFBundleURLName: forge
            CFBundleURLSchemes: [forge]
        NSCalendarsFullAccessUsageDescription: Forge shows your events in Today and, only when you approve, adds planned time blocks.
        NSRemindersFullAccessUsageDescription: Forge syncs the Reminders lists you choose with your dashboard, both ways.
    dependencies:
      - target: ForgeWidgets
      - target: ForgeWatch
    entitlements:
      path: Support/Xcode.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.raoulreinder.forge]
  # Widgets, Lock Screen / StandBy and the focus Live Activity (Phase 7). Xcode route only:
  # xtool builds the app target from Package.swift and doesn't build this extension.
  ForgeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ForgeWidgets
      - Forge/Shared
      - Forge/Design/HexColor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.forge.widgets
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET
    info:
      path: ForgeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Forge
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ForgeWidgets/ForgeWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.raoulreinder.forge]
  # Apple Watch companion (Phase 16). Xcode route only. Talks to the iPhone app over WatchConnectivity.
  ForgeWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - ForgeWatch
      - path: Forge/Shared/WidgetShared.swift
      - Forge/Design/HexColor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.forge.watchkitapp
        CODE_SIGN_STYLE: Automatic
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WATCH
    info:
      path: ForgeWatch/Info.plist
      properties:
        CFBundleDisplayName: Forge
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.yourname.forge
